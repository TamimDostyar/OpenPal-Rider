spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect


brevo.api.key=${BREVO_API_KEY:}
openpal.mail.from=${MAIL_USERNAME:}
openpal.mail.fromName=${MAIL_FROM_NAME:OpenPal}

openpal.moderation.email=${MODERATION_EMAIL:${MAIL_USERNAME:}}


openpal.admin.emails=${ADMIN_EMAILS:}

openpal.jwt.secret=${JWT_SECRET}