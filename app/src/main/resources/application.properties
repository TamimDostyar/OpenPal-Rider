# DB credentials come from env vars — set DB_URL / DB_USERNAME / DB_PASSWORD.
# Also accept Spring-standard env vars for Render compatibility.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Gmail SMTP — used to email the 4-digit verification code.
# Set MAIL_USERNAME / MAIL_PASSWORD env vars (password = a Google App Password).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# address the verification email is sent from
openpal.mail.from=${MAIL_USERNAME:}

# secret used to sign/verify JWTs
openpal.jwt.secret=${JWT_SECRET}