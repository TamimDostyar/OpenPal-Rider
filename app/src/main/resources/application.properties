# DB credentials come from env vars — set DB_URL / DB_USERNAME / DB_PASSWORD.
# Also accept Spring-standard env vars for Render compatibility.
spring.datasource.url=${SPRING_DATASOURCE_URL:${DB_URL}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD}}
spring.datasource.driver-class-name=org.postgresql.Driver

# Supabase's port-6543 endpoint is PgBouncer in transaction-pooling mode.
# It recycles backend connections across clients, which breaks the JDBC
# driver's server-side prepared-statement cache ("prepared statement S_2
# already exists"). Disable it so every query is sent as a simple query.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Email delivery via Brevo's HTTPS API (smtp.gmail.com:587 is blocked outbound
# on Render). Set BREVO_API_KEY to a Brevo transactional API key, and
# MAIL_USERNAME to a from-address that is a *verified sender* in Brevo.
brevo.api.key=${BREVO_API_KEY:}
openpal.mail.from=${MAIL_USERNAME:}
openpal.mail.fromName=${MAIL_FROM_NAME:OpenPal}
# Where moderation alerts go when a user blocks someone. Defaults to the
# configured from-address if unset.
openpal.moderation.email=${MODERATION_EMAIL:${MAIL_USERNAME:}}

# Comma-separated allowlist of moderator/admin emails. These accounts can use
# the /api/admin moderation endpoints (review reports, remove posts, ban users).
openpal.admin.emails=${ADMIN_EMAILS:}

# secret used to sign/verify JWTs
openpal.jwt.secret=${JWT_SECRET}