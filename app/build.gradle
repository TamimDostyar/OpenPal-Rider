plugins {
    id 'application'
    id 'eclipse'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

layout.buildDirectory = file("$rootDir/build/app")
eclipse {
    classpath {
        defaultOutputDir = file("$rootDir/bin/app")
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.guava
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.security:spring-security-crypto'
    // loads .env into the Spring environment so secrets stay out of source
    implementation 'me.paulschwarz:spring-dotenv:4.0.0'
    runtimeOnly 'org.postgresql:postgresql'

    testRuntimeOnly 'com.h2database:h2'

    // jwt
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // scrape for schools
    implementation 'org.jsoup:jsoup:1.17.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

sourceSets {
    main {
        java {
            srcDirs = ['main/src']
        }
        resources {
            srcDirs = ['main/src/resources']
        }
    }
    test {
        java {
            srcDirs = ['test/src']
        }
        resources {
            srcDirs = ['test/src/resources']
        }
    }

}

application {
    mainClass = 'openpal.App'
}

tasks.named('test') {
    useJUnitPlatform()
}

tasks.named('bootRun') {
    workingDir = rootDir
}
