plugins {
    id 'application'
    id 'eclipse'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

// Put Gradle build output and Eclipse/VS Code bin/ outside the app/ module
layout.buildDirectory = file("$rootDir/build/app")
eclipse {
    classpath {
        defaultOutputDir = file("$rootDir/bin/app")
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation libs.guava
    implementation 'org.springframework.boot:spring-boot-starter-web'
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.security:spring-security-crypto'
    runtimeOnly 'org.postgresql:postgresql'

    // in-memory database so repository/integration tests never touch Supabase
    testRuntimeOnly 'com.h2database:h2'
}

testing {
    suites {
        test {
            useJUnitJupiter()
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    mainClass = 'openpal.App'
}
