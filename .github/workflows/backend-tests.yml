name: PalRiders - Backend Tests
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - run: chmod +x ./gradlew
      - run: ./gradlew :app:test --no-daemon
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: build/app/reports/tests/test
